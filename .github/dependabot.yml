# Dependabot version updates. Security updates are enabled separately in the
# repository settings.
#
# The workspace is on pnpm: the `npm` ecosystem at `/` reads
# pnpm-workspace.yaml and its catalogs, which cover every package and the
# example apps (they are workspace members), and updates pnpm-lock.yaml.
#
# A group exists only where its members must move at the same time (one
# release train with exact cross-pins, or a hard compatibility table);
# everything else, each GitHub Action included, updates on its own PR.
# Dependabot puts a dependency in the FIRST group that matches it, so
# `exclude-patterns` keep `@effect/tsgo` out of `effect`. Each group takes
# every update type, majors included, so a set that must move together
# always arrives as one PR:
#
# - toolchain: vite-plus pins the `oxlint`, `oxfmt`, `oxlint-tsgolint` and
#   `vitest` it carries (and `vite` is its aliased core), and `effect-tsgo
#   patch` matches the native `tsc` and `oxlint` by gitHead / version and
#   hard-errors (UnsupportedTargetPackageVersionError) on any pairing it has
#   no artifact for. Before merging, check the `components` table in
#   node_modules/@effect/tsgo/dist/effect-tsgo.cjs; when a vite-plus bump
#   outruns it, pick the `@effect/tsgo` release that covers the new oxlint /
#   tsgolint by hand on the PR's branch. The Effect lint preset
#   (`@enfect/oxlint`) and `@effect/language-service` are not in it: neither
#   pins an oxlint or TypeScript version, so each updates on its own.
# - effect: the Effect release line is a lockstep singleton set (`effect`,
#   the `@effect/*` runtime packages and the `@effect/platform-node-shared`
#   catalog entry the `overrides` pin uses). The published floor under
#   `catalogs.peers` is hand-set; CI tests every PR at both the pin and the
#   floor (`ci.yml`, "Tests (effect floor)").
# - svelte: the compiler, SvelteKit, its adapters / Vite plugin and
#   svelte-check peer on each other.
#
# Hand moves Dependabot cannot make (do them on the matching group's PR):
# - the npm-alias catalog entries: `vite` (`npm:@voidzero-dev/vite-plus-core`,
#   always equal to `vite-plus`; `pnpm dlx --package=vite-plus@<v> vp migrate
#   --no-interactive` re-pins it, then drop the `minimumReleaseAgeExclude`
#   entries it adds), `typescript` (`npm:@typescript/typescript6`) and
#   `@typescript/native` (`npm:typescript`, matching @effect/tsgo's gitHead);
# - the `overrides` keys (`vite@*`, `vitest@*`, `effect`,
#   `@effect/platform-node-shared`), which follow their catalog entries;
# - `catalogs.peers`, the published floors (a `minor` changeset to move).
#
# `cooldown` is 1 day (Dependabot takes whole days only), with the same
# first-party exemption as `minimumReleaseAgeExclude`. pnpm-workspace.yaml's
# `minimumReleaseAge` is 480 minutes (8 hours), so a Dependabot PR never
# proposes a version pnpm would still refuse to install.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      # vite-plus pins vite / vitest / oxlint; the tsgo patch pairs with them.
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@voidzero-dev/*"
        update-types: ["major", "minor", "patch"]
      # One release train: every Effect runtime package at one version.
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/language-service"
        update-types: ["major", "minor", "patch"]
      # The Svelte packages peer on each other's releases.
      svelte:
        applies-to: version-updates
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "svelte-check"
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    # No groups: each action updates on its own PR.
    cooldown:
      default-days: 1
  # The .devcontainer/ features and their lockfile (the image tag moves with
  # vite-plus by hand).
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
