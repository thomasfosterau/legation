# Dependabot version updates. Security updates are enabled separately in the
# repository settings.
#
# The workspace is on pnpm: the `npm` ecosystem at `/` reads
# pnpm-workspace.yaml and its catalogs, which cover every package and the
# example apps (they are workspace members), and updates pnpm-lock.yaml.
#
# Dependabot puts a dependency in the FIRST group that matches it, so the
# groups run specific → general, and `exclude-patterns` keep a package out of
# a broader group it would otherwise also match. Each lockstep group takes
# every update type, majors included, so a set that must move together
# always arrives as one PR:
#
# - toolchain: vite-plus pins the `oxlint`, `oxfmt`, `oxlint-tsgolint` and
#   `vitest` it carries (and `vite` is its aliased core), and `effect-tsgo
#   patch` matches the native `tsc` and `oxlint` by gitHead / version and
#   hard-errors (UnsupportedTargetPackageVersionError) on any pairing it has
#   no artifact for. The TS6 alias (`typescript`), the language service and
#   the Effect lint plugin ride along (pnpm-workspace.yaml catalog comments).
#   Before merging, check the `components` table in
#   node_modules/@effect/tsgo/dist/effect-tsgo.cjs.
# - effect: the Effect release line is a lockstep singleton set (`effect`,
#   the `@effect/*` runtime packages and the `@effect/platform-node-shared`
#   catalog entry the `overrides` pin uses). The published floor under
#   `catalogs.peers` is hand-set; CI tests every PR at both the pin and the
#   floor (`ci.yml`, "Tests (effect floor)").
# - svelte, playwright, cloudflare, package-lint, changesets, fallow: the
#   other sets whose members are released and tested together.
# - minor-and-patch: everything else, minor and patch only, so PR volume
#   stays low; a major outside a lockstep set arrives on its own.
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge` (1 day), with
# the same first-party exemption as `minimumReleaseAgeExclude`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/tsgo"
          - "@effect/language-service"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@mpsuesser/oxlint-plugin-effect"
        update-types: ["major", "minor", "patch"]
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/language-service"
        update-types: ["major", "minor", "patch"]
      svelte:
        applies-to: version-updates
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "svelte-check"
        update-types: ["major", "minor", "patch"]
      playwright:
        applies-to: version-updates
        patterns:
          - "playwright"
          - "playwright-core"
          - "@playwright/*"
        update-types: ["major", "minor", "patch"]
      cloudflare:
        applies-to: version-updates
        patterns:
          - "@cloudflare/*"
          - "wrangler"
          - "miniflare"
        update-types: ["major", "minor", "patch"]
      package-lint:
        applies-to: version-updates
        patterns:
          - "publint"
          - "@arethetypeswrong/*"
        update-types: ["major", "minor", "patch"]
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
        update-types: ["major", "minor", "patch"]
      fallow:
        applies-to: version-updates
        patterns:
          - "fallow"
        update-types: ["major", "minor", "patch"]
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns:
          - "*"
