# `uvx zizmor --offline .github`.
rules:
  dependabot-cooldown:
    config:
      # Matches pnpm's 24-hour `minimumReleaseAge`.
      days: 1
  unpinned-uses:
    config:
      # Actions are pinned to exact tags; .github/workflows/actions.lock pins their commits.
      policies:
        "*": ref-pin
