name: Kotlin

# Builds and tests the Kotlin package (packages/kotlin). Like the Swift package,
# it lives outside the bun workspace (ADR-0013) and has its own gate run with the
# Kotlin/Gradle toolchain rather than the TypeScript quality gates in ci.yml.

on:
  pull_request:
    paths:
      - "packages/kotlin/**"
      - ".github/workflows/kotlin.yml"
  push:
    branches:
      - main
    paths:
      - "packages/kotlin/**"
      - ".github/workflows/kotlin.yml"

jobs:
  test:
    name: Build and test (JVM)
    runs-on: ubuntu-latest
    container:
      image: gradle:8.14.3-jdk21
      options: --user root
    defaults:
      run:
        working-directory: packages/kotlin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle version
        run: gradle --version

      - name: Build and test
        run: gradle test --no-daemon --console=plain
