name: Compose example

# Builds the Compose for Desktop example (examples/compose-todo), which consumes
# the Kotlin engine via an included build. Runs on any branch push so the example
# is verified before a PR exists. Compose pulls androidx artifacts from Google's
# Maven repo, which the CI runner can reach.

on:
  pull_request:
    paths:
      - "examples/compose-todo/**"
      - "packages/kotlin/**"
      - ".github/workflows/compose-example.yml"
  push:
    paths:
      - "examples/compose-todo/**"
      - "packages/kotlin/**"
      - ".github/workflows/compose-example.yml"

jobs:
  build:
    name: Build (JVM)
    runs-on: ubuntu-latest
    container:
      image: gradle:8.14.3-jdk21
      options: --user root
    defaults:
      run:
        working-directory: examples/compose-todo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: gradle build --no-daemon --console=plain
