name: Swift

# Builds and tests the Swift package (packages/swift). It lives outside the bun
# workspace (ADR-0012), so it has its own gate run with the Swift toolchain
# rather than the TypeScript quality gates in ci.yml. The `EffectSync` target
# and its tests build on Linux; `EffectSyncData` (SwiftData) is an empty module
# off Apple platforms, so a Linux runner exercises the full client engine.

on:
  pull_request:
    paths:
      - "packages/swift/**"
      - ".github/workflows/swift.yml"
  push:
    branches:
      - main
    paths:
      - "packages/swift/**"
      - ".github/workflows/swift.yml"

jobs:
  test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    defaults:
      run:
        working-directory: packages/swift
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
