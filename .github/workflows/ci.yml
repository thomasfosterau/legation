name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so fallow audit can diff against the base branch.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Typecheck (packages and tests)
        run: bun run typecheck

      - name: Typecheck examples
        run: bun run typecheck:examples

      - name: Test with coverage
        run: bun run test:coverage

      - name: Fallow audit
        run: bun run analyze:audit:ci
