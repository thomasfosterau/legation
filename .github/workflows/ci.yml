name: CI

on:
  pull_request:
  push:
    branches:
      - trunk

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so fallow audit can diff against the base branch.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Typecheck (packages and tests)
        run: bun run typecheck

      - name: Typecheck examples
        run: bun run typecheck:examples

      - name: Install Chromium (the commerce façade's browser test)
        run: bunx playwright-core install --with-deps chromium

      - name: Test with coverage
        run: bun run test:coverage

      - name: Fallow audit
        run: bun run analyze:audit:ci
