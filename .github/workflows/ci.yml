name: CI

on:
  pull_request:
  push:
    branches:
      - trunk

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so fallow audit can diff against the base branch.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # vitest, tsc and the Node adapter's tests run on Node (bun runs their
      # `#!/usr/bin/env node` bins). Pin the line explicitly: it is the one
      # `@legation/node` declares in `engines.node` (ADR-0003), and the
      # release job publishes from the same line.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Install dependencies
        run: bun ci

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Typecheck (packages and tests)
        run: bun run typecheck

      - name: Typecheck examples
        run: bun run typecheck:examples

      - name: Install Chromium (the commerce façade's browser test)
        run: bunx playwright-core install --with-deps chromium

      - name: Test with coverage
        run: bun run test:coverage

      - name: Fallow audit
        run: bun run analyze:audit:ci
