name: CI

# One job per Node.js line running `vp run ci`; the task graph lives in
# vite.config.ts, so a local `vp run ci` is the same pipeline.

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]
    # For the PostgreSQL overlap test, which fails rather than skips in CI
    # without DATABASE_URL.
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # `fallow audit` diffs against origin/trunk.
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: ${{ matrix.node }}
          cache: true
          run-install: true
      - name: Restore the Vite+ task cache
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v2-${{ runner.os }}-node-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            vp-task-v2-${{ runner.os }}-node-${{ matrix.node }}-
      - name: CI
        run: vp run ci

  devcontainer:
    name: devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # `vp dlx` honours `minimumReleaseAge`: keep this at a release ≥24 hours old.
      DEVCONTAINER_CLI: "@devcontainers/cli@0.89.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Only to run the CLI on the runner; the container brings its own.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: false
      # Fails when the image, a feature or `postCreateCommand` fails.
      - name: Build and start the container
        run: vp dlx "$DEVCONTAINER_CLI" up --workspace-folder . --log-level info
      - name: Check the toolchain inside it
        run: vp dlx "$DEVCONTAINER_CLI" exec --workspace-folder . bash -lc 'vp --version && test -x node_modules/.bin/vp'
