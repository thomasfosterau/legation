name: Lockfile

# Every action in every workflow is pinned by .github/workflows/actions.lock,
# generated by `gh actions-lock` (github/gh-actions-lock). This checks that the
# lock covers every `uses:` and that each locked commit is still the one its
# tag names. Its own workflow so the lock check stays separate from CI.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify the workflow lockfile
        run: gh actions-lock --verify
