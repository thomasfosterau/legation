name: Release

# Changesets release flow (PUBLISHING.md): on every push to `trunk`,
# changesets/action either opens/updates the "chore: version packages" PR
# (while unreleased changesets exist) or, once that PR has merged and no
# changesets remain, publishes the packages to npm and tags the release.
# Shaped like the effect-web library's release workflow.
#
# Publishing uses npm OIDC trusted publishing: there is no NPM_TOKEN. The
# workflow proves its identity to npm with a short-lived, workflow-bound
# OIDC token. Provenance is left to npm (never forced).

on:
  push:
    branches: [trunk]

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version or publish
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on the owner's behalf).
    if: github.repository == 'thomasfosterau/legation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Requires manual approval via a protected GitHub Environment named
    # "release". See PUBLISHING.md for the one-time setup.
    environment: release
    permissions:
      contents: write # push the version commit/tag and the "Version Packages" PR branch
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` it compares node_modules with the manifests
      # and, if a manifest looks newer than the last install, re-installs
      # WITH lifecycle scripts, ignoring the `--ignore-scripts` of the install
      # step below. That re-install runs the root `prepare` (`vp config` +
      # `effect-tsgo patch`) and every `allowBuilds` dependency's build script
      # inside this job, which holds `id-token: write`. It triggers whenever
      # a manifest's mtime moves after the install step, e.g. when the
      # Changesets action checks out an existing `changeset-release/trunk`
      # and `git reset --hard`s it back before `pnpm run version`. Scoped to
      # this job: CI and local runs keep the default. pnpm 11 reads only the
      # `pnpm_config_*` spelling.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        # The Changesets action pushes the version branch, so it needs the
        # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] the Changesets action pushes
        with:
          fetch-depth: 0

      # Installs the pnpm version pinned by the package.json "packageManager"
      # field. Must run before setup-node so its pnpm cache can find the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Never `latest`: setup-node resolves it to the first entry of the
          # nodejs.org index, pre-releases included (a v27 alpha since
          # 2026-10-29). `*` + `check-latest` is the newest stable release.
          node-version: "*"
          check-latest: true
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # `pnpm run release` uploads each checked tarball with
      # `npm publish <tarball>` (scripts/publish.mjs), and npm OIDC trusted
      # publishing requires npm >= 11.5.1. Pinned to a major, never `@latest`:
      # this job holds `id-token: write`, so a new npm major should arrive
      # through a reviewed change (#265).
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@11 # zizmor: ignore[adhoc-packages] the publisher itself, major-pinned (#265)

      # --ignore-scripts stops a compromised dependency from running install
      # scripts in the privileged publish job (the Shai-Hulud vector). It also
      # skips this workspace's own `prepare` (git hooks + the tsc/oxlint
      # patch), neither of which the `vp pack` build needs. It only holds
      # because `pnpm_config_verify_deps_before_run` is off for this job (see
      # the job `env` above).
      - name: Install dependencies
        # `pnpm run` puts node_modules/.bin on PATH for the scripts below, so
        # nothing writes GITHUB_PATH.
        run: pnpm install --frozen-lockfile --ignore-scripts

      # When changesets are pending, this opens/updates a "chore: version
      # packages" PR (via `pnpm run version`). Once that PR is merged (no
      # changesets remain), it runs `pnpm run release`: `vp run build`, then
      # scripts/publish.mjs packs every unpublished package with `pnpm pack`
      # (which rewrites `workspace:` and `catalog:`; #267), runs the tarball
      # checks CI's `pack:check` runs, and uploads each tarball with
      # `npm publish` under OIDC trusted publishing. There is no NPM_TOKEN to
      # steal, and provenance is left to npm (an explicit request fails from a
      # private repository). The script reports each published package on
      # `CHANGESETS_OUTPUT`; the action then pushes the tags and creates the
      # GitHub releases.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in
      # devDependencies) and renamed its inputs from v1's `version` / `publish`
      # / `commit` / `title`.
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
