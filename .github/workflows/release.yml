name: Release

# Changesets release flow (CONTRIBUTING.md "Releases"): on every push to
# `trunk`, changesets/action either opens/updates the "Version Packages" PR
# (while unreleased changesets exist) or, once that PR has merged and no
# changesets remain, publishes the packages to npm and tags the release.
#
# Publishing uses npm OIDC trusted publishing: there is no NPM_TOKEN. The
# workflow proves its identity to npm with a short-lived, workflow-bound
# OIDC token. Provenance is left to npm (never forced).

on:
  push:
    branches:
      - trunk

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version or Publish
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on the owner's behalf).
    if: github.repository == 'thomasfosterau/legation'
    runs-on: ubuntu-latest
    # Requires manual approval via a protected GitHub Environment named
    # "release". See CONTRIBUTING.md "Releases" for the one-time setup.
    environment: release
    permissions:
      contents: write # push the version commit/tag and the "Version Packages" PR branch
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    steps:
      - name: Checkout
        # The Changesets action pushes the version branch, so it needs the
        # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `analyze:audit` (fallow) can diff against origin/trunk.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js (npm registry for trusted publishing)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      # `bun run release` uploads each tarball with `npm publish <tarball>`, and
      # npm OIDC trusted publishing requires npm >= 11.5.1, which is newer than
      # the npm bundled with Node 22. Pinned to a major, never `@latest`: this
      # job holds `id-token: write`, so a new npm major should arrive through a
      # reviewed change (#265).
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@11

      # bun does not run dependency lifecycle scripts unless they are listed
      # in `trustedDependencies`, so a compromised (transitive) dependency
      # cannot execute install hooks in this privileged job. The root
      # `prepare` script (effect-language-service patch) is ours and runs.
      - name: Install dependencies
        run: bun ci

      # `test:run` includes the commerce façade's browser test, which fails
      # (rather than skips) without Chromium — the same step CI runs.
      - name: Install Chromium (the commerce façade's browser test)
        run: bunx playwright-core install --with-deps chromium

      - name: Verify
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun run build
          bun run test:run
          bun run analyze:audit

      # When changesets are pending, this opens/updates a "Version Packages" PR
      # (via `bun run version`). Once that PR is merged (no changesets remain),
      # it runs `bun run release` (scripts/release.ts): it builds, packs every
      # unpublished package with `bun pm pack` (which rewrites `workspace:^`
      # and `catalog:`; #267) and runs `changeset publish --from-pack-dir`,
      # i.e. `npm publish <tarball>` per package under OIDC trusted publishing
      # (`bun publish` can't do OIDC). There is no NPM_TOKEN to steal, and
      # provenance is left to npm. The action then pushes the tags and creates
      # the GitHub releases.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in
      # devDependencies) and renamed its inputs from v1's `version` / `publish`
      # / `commit` / `title`.
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version
          publish-script: bun run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't force provenance; npm attaches it itself when allowed, and an
          # explicit request fails from a private repository.
