name: Effect rc compatibility

# Weekly canary: install the latest effect@rc (instead of the pinned
# version) and run the full quality gates. The published peer range is open
# (`>=4.0.0-rc.113`), so consumers can resolve an rc newer than the pin; this
# job exercises that upper end. Failures here do NOT block anything — they
# signal that the next bump needs attention. (The file keeps its historical
# `beta` name; the `beta` dist-tag stopped moving at 4.0.0-beta.107.)
# See ADR-0003 and CONTRIBUTING.md "Effect version upgrades".

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  canary:
    name: Latest effect@rc canary
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install

      - name: Resolve latest effect rc
        id: beta
        run: |
          LATEST=$(bun pm view effect dist-tags.rc 2>/dev/null || npm view effect dist-tags.rc)
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest effect rc: $LATEST"

      - name: Point the catalog at the latest effect rc
        env:
          VERSION: ${{ steps.beta.outputs.version }}
        run: |
          # Every package's devDependencies reference `effect: "catalog:"`, so
          # overriding the catalog entries (and the `overrides` entry that
          # holds @effect/platform-node-shared in lockstep) rebuilds the whole
          # workspace against the latest rc.
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            for (const name of Object.keys(pkg.workspaces.catalog)) {
              pkg.workspaces.catalog[name] = process.env.VERSION;
            }
            for (const name of Object.keys(pkg.overrides ?? {})) {
              if (name.startsWith("@effect/")) pkg.overrides[name] = process.env.VERSION;
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          bun install

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:run

      - name: Report
        if: always()
        run: |
          echo "## Effect rc canary: ${{ steps.beta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned version in repo: $(node -p "require('./package.json').workspaces.catalog.effect")" >> "$GITHUB_STEP_SUMMARY"
          echo "Job status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
