name: Pages

# Builds the API reference with @effect/docgen, renders its Markdown with
# Jekyll and the just-the-docs theme, and publishes it to GitHub Pages.

on:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: true
      - name: Generate the API reference
        run: vp run docgen
      - name: Assemble the site
        # One section per docgen.json: its package's modules, titled by path.
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          site=_pages
          rm -rf "$site"
          mkdir -p "$site/docs"
          cat > "$site/_config.yml" <<YAML
          title: $repo
          description: API reference for $repo, generated by @effect/docgen.
          remote_theme: just-the-docs/just-the-docs@v0.12.0
          plugins:
            - jekyll-remote-theme
          search_enabled: true
          heading_anchors: true
          defaults:
            - scope:
                path: ""
              values:
                layout: default
          aux_links:
            "$repo on GitHub":
              - "https://github.com/$GITHUB_REPOSITORY"
          YAML
          printf -- '---\ntitle: Home\nnav_order: 1\npermalink: /\n---\n\n# %s\n\nThe API reference, generated from the doc comments by [@effect/docgen](https://github.com/Effect-TS/docgen). Guides and source are in the [repository](https://github.com/%s).\n\n' \
            "$repo" "$GITHUB_REPOSITORY" > "$site/index.md"
          order=2
          for config in $(git ls-files -- docgen.json '*/docgen.json' | sort); do
            pkg=$(dirname "$config")
            modules="$pkg/$(jq -r '.outDir // "docs"' "$config")/modules"
            if [ ! -d "$modules" ]; then
              echo "::error file=$config::$modules is missing; did docgen run?"
              exit 1
            fi
            name=$(jq -r .name "$pkg/package.json")
            description=$(jq -r '.description // ""' "$pkg/package.json")
            slug=${name##*/}
            printf -- '---\ntitle: "%s"\nhas_children: true\nnav_order: %d\npermalink: /docs/%s/\n---\n\n# %s\n\n%s\n' \
              "$name" "$order" "$slug" "$name" "$description" > "$site/docs/$slug.md"
            printf -- '- [`%s`](docs/%s/): %s\n' "$name" "$slug" "$description" >> "$site/index.md"
            (cd "$modules" && find . -name '*.md' ! -path ./index.md | sed 's|^\./||') | while IFS= read -r page; do
              mkdir -p "$site/docs/$slug/$(dirname "$page")"
              # Title each page by its module path, parent it under the package, and
              # leave its order to the title sort; `raw` keeps Liquid out of code.
              awk -v title="${page%.md}" -v parent="$name" '
                NR == 1 && $0 == "---" { fm = 1; print; next }
                fm && $0 == "---" { fm = 0; print; print "{% raw %}"; next }
                fm && /^title: / { print "title: \"" title "\""; next }
                fm && /^parent: / { print "parent: \"" parent "\""; next }
                fm && /^nav_order: / { next }
                { print }
                END { print "{% endraw %}" }
              ' "$modules/$page" > "$site/docs/$slug/$page"
            done
            order=$((order + 1))
          done
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: _pages
          destination: _site
      - uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
