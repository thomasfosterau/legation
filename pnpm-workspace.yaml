# Every external version lives here; package.json files reference only
# `catalog:`, a named catalog or `workspace:`.
packages:
  - packages/*
  - examples/*

catalogMode: strict

catalog:
  "@effect/docgen": ^4.1.5
  # One release train at exact versions. 2.0.0-beta.87 is the release the apps
  # pin; it requires `effect ^4.1.4` (see `catalogs.alchemy-peers`).
  alchemy: 2.0.0-beta.87
  "@alchemy.run/cloudflare": 2.0.0-beta.87
  # The repository's GitHub settings (`stacks/github.ts`).
  "@alchemy.run/github": 2.0.0-beta.87
  "@arethetypeswrong/cli": ^0.18.5
  "@changesets/cli": ^3.0.3
  # The workerd types `@alchemy.run/cloudflare`'s declarations import.
  "@cloudflare/workers-types": ^5.20261124.2
  # The Effect dev pin: `effect` and every `@effect/*` runtime package at one
  # version. `vp run ci:floor` (scripts/effect-floor.mjs) rewrites these
  # entries to a published floor.
  effect: 4.1.5
  "@effect/platform-browser": 4.1.5
  "@effect/platform-node": 4.1.5
  # Transitive (of `@effect/platform-node` and `@alchemy.run/cloudflare`),
  # held at the pin by `overrides` so the lockfile has one Effect line.
  "@effect/platform-node-shared": 4.1.5
  "@effect/sql-d1": 4.1.5
  "@effect/sql-pg": 4.1.5
  "@effect/sql-sqlite-node": 4.1.5
  "@effect/vitest": 4.1.5
  "@effect/language-service": ^0.87.3
  # `effect-tsgo patch` replaces the native `tsc` and vite-plus's oxlint /
  # tsrs with Effect-patched builds and fails `pnpm install` on versions it
  # doesn't support. 0.73.2 supports typescript 7.0.2, oxlint 1.91.0–1.94.0
  # and tsrs 7.1.0-beta.tsrs2–tsrs3. Check the `components` table in
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs before bumping it,
  # `@typescript/native` or `vite-plus`.
  "@effect/tsgo": 0.73.2
  "@electric-sql/pglite": ^0.6.0
  "@enfect/oxlint": 0.10.0
  "@sveltejs/adapter-node": ^6.0.5
  "@sveltejs/adapter-static": ^4.0.1
  "@sveltejs/kit": ^3.4.0
  "@sveltejs/vite-plugin-svelte": ^7.3.2
  "@thomasfosterau/effect-jsonapi": ^0.22.2
  "@thomasfosterau/effect-auth": 0.5.2
  "@thomasfosterau/effect-svelte": ^0.8.0
  "@types/better-sqlite3": ^9.6.0
  "@types/node": ^26.6.6
  # Must equal the vitest vite-plus bundles.
  "@vitest/coverage-v8": 5.1.0
  better-auth: ^1.7.27
  better-sqlite3: ^13.2.0
  fake-indexeddb: ^6.2.8
  fallow: 3.48.0
  jsdom: ^31.0.1
  # Exact: each release expects one Chromium revision.
  playwright-core: 1.65.1
  publint: ^0.3.25
  svelte: ^5.59.1
  svelte-check: ^4.7.8
  # TypeScript 6 for JS-API consumers (svelte-check, the language service,
  # tsdown's declaration bundler; bin `tsc6`) beside the native TypeScript 7
  # `tsc` that type-checks, whose version must match @effect/tsgo's binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins oxlint, oxfmt and vitest; `vite` (its aliased core, no
  # longer the vite-plus version) and `vitest` equal what it depends on.
  vite-plus: 1.7.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0

# The published peer ranges (`pnpm pack` writes them into the tarball). Never
# exact. `effect` is `^4.0.0` unless a package's own dependency requires more;
# raising a floor is a `minor` changeset.
catalogs:
  peers:
    effect: ^4.0.0
    "@effect/platform-browser": ^4.0.0
    svelte: ">=5.40"
    "@sveltejs/kit": ^2.0.0 || ^3.0.0
  # legation-alchemy-cloudflare: Alchemy beta.87 peers `effect ^4.1.4`, and
  # each `@alchemy.run/*` release pins `alchemy` exactly.
  alchemy-peers:
    effect: ^4.1.4
    alchemy: 2.0.0-beta.87
    "@alchemy.run/cloudflare": 2.0.0-beta.87
  # legation-auth: effect-auth 0.5.x peers `effect ^4.1.0`.
  auth-peers:
    effect: ^4.1.0
    "@thomasfosterau/effect-auth": ^0.5.2
  # legation-jsonapi: effect-jsonapi 0.22.x peers `effect ^4.1.0`.
  jsonapi-peers:
    effect: ^4.1.0
    "@thomasfosterau/effect-jsonapi": ^0.22.2

overrides:
  # `effect` must be a singleton: two copies break Context / Layer / Schema identity.
  effect: "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-d1": "catalog:"
  # `@effect/sql-d1` pins an exact release; one copy keeps `DurableObjectState` assignable.
  "@cloudflare/workers-types": "catalog:"
  # Vite+'s managed overrides.
  vite@*: "catalog:"
  vitest@*: "catalog:"

nodeLinker: hoisted

allowBuilds:
  # The commerce example's server.
  better-sqlite3: true
  esbuild: true
  fallow: true
  # Nothing here runs workerd; the Alchemy adapter's tests stub the provider.
  workerd: false

# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up. Build grants stay in `allowBuilds`: a `permissions` entry without `build`
# leaves its package's `allowBuilds` grant in force.
permissions:
  fallow:
    skills: [fallow]

skills:
  dirs: [.claude/skills]

# Hold new versions for 24 hours (minutes); first-party releases are exempt.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"
